name: Verify
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
      matrix: ${{ steps.workloads.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Evidence is only a push run of this workflow from this repository, never this run: a pull request
          # tests its merge ref, a dispatch may run a subset, and a PR run of this workflow may itself be a skip.
          # Prints "<status> <conclusion>" of the newest such run on SHA $1, or nothing (any API error: nothing).
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # C1: main push of a SHA whose newest push run of this workflow (a branch run) is green.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # C3 (exact): same tree as the parent, and the parent's newest push run is green (e.g. an empty commit).
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # C2: same-repository PR. The lander takes any green same-repo run on the exact SHA as evidence,
          # pull_request runs included, so this run may pass without shards only when the push run on the
          # PR head is green: wait for it (at most 25 minutes).
          # No push run, any other result, or the wait running out: run in full.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      - name: Partition the existing application verification commands
        id: workloads
        shell: python
        run: |
          import json, os, re, shlex
          from pathlib import Path

          commands = [shlex.split(c) for c in json.loads(Path('package.json').read_text())['scripts']['verify:app'].split(' && ')]
          # These run once in build-checks or portability. Anything else must be
          # a supported browser selection; new command shapes fail closed.
          fixed = [shlex.split(c) for c in [
              'pnpm run build', 'pnpm run typecheck', 'pnpm run test:api',
              'pnpm run test:site', 'node tests/email-link.mjs', 'node tests/portable.mjs']]
          for command in fixed:
              if commands.count(command) != 1:
                  raise ValueError(f'Expected one verification command: {command}')
          browser = [c for c in commands if c not in fixed]
          # The spend-authority journey was also invoked by the connector step;
          # verify:app already selects it. Keep one execution of that assertion.
          browser += [
              ['node', 'tests/browser/run.mjs', 'stock.spec.ts', '--grep', 'STOCK-001'],
              ['node', 'tests/browser/run.mjs', 'supplier-returns.spec.ts', '--grep', 'BUY-003'],
              ['node', 'tests/browser/run.mjs', 'dispatch.spec.ts', '--grep', 'WMS-003']]
          patterns = [[], [], []]
          for index, command in enumerate(browser):
              if command[:2] != ['node', 'tests/browser/run.mjs']:
                  raise ValueError(f'Unmapped verification command: {command}')
              args = command[2:]
              file = args.pop(0) if args and not args[0].startswith('--') else None
              if file and not re.fullmatch(r'[\w-]+\.spec\.ts', file):
                  raise ValueError(f'Unsupported browser file selection: {file}')
              if args and (len(args) != 2 or args[0] != '--grep'):
                  raise ValueError(f'Unsupported browser arguments: {args}')
              # Playwright matches grep against the full title, including file.
              # Union selections share one real setup/dev runtime per shard.
              pattern = f'(?:{args[1]})' if args else ''
              if file:
                  pattern = re.escape(file) + ' ' + '.*' + pattern
              if not pattern:
                  raise ValueError('Refuse an unbounded browser selection')
              patterns[index % 3].append(pattern)
          matrix = []
          groups, sizes = [[], [], [], []], [0, 0, 0, 0]
          for file in sorted(Path('tests/api').glob('*.test.mjs'), key=lambda p: (-p.stat().st_size, str(p))):
              group = min(range(4), key=lambda i: sizes[i])
              groups[group].append(str(file))
              sizes[group] += file.stat().st_size
          if any(not group for group in groups):
              raise ValueError('Every API shard must execute files')
          for index, files in enumerate(groups):
              matrix.append(dict(name=f'api-{index + 1}', kind='api', files=files, grep=''))
          for index, group in enumerate(patterns):
              matrix.append(dict(name=f'browser-{index + 1}', kind='browser', files=[], grep='|'.join(f'(?:{p})' for p in group)))
          matrix.append(dict(name='portability', kind='portability', files=[], grep=''))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(dict(include=matrix), separators=(',', ':')) + '\n')

  build-checks:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted runner toolchain space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # rer dev and preview require 15 GiB free. This disposable JavaScript job
          # does not use Android, .NET or Haskell; preserve Node, browsers and caches.
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          for toolchain in /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup; do
            if df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | awk '
              NR > 1 && $4 < 20 * 1024 * 1024 { insufficient = 1 }
              END { exit insufficient }
            '; then
              break
            fi
            sudo rm -rf -- "$toolchain"
          done
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: corepack enable && corepack prepare pnpm@10.12.4 --activate
      - run: pnpm install --frozen-lockfile
      - run: node src/base/contract-docs.mjs check
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - run: pnpm exec rer check --profile first-party
      # Decompose verify:app across this job and the eight shards below. Do not
      # invoke rer verify here: that would execute the complete suite again.
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run test:site
      - run: node tests/email-link.mjs
      - name: Verify the emitted production Worker and hydration
        run: |
          node --input-type=module <<'JS'
          import { resolveProject } from '@runeditrun/rer/internal/cli/project.mjs';
          import { checkHostedOutput } from '@runeditrun/rer/internal/cli/hosted-output.mjs';
          import { checkHydration } from '@runeditrun/rer/internal/cli/hydration/check.mjs';
          // These are the two checks rer verify runs after verify:app, with
          // the same deployed declaration and public pages from the adapter.
          const project = await resolveProject(process.cwd());
          const declaration = project.adapter.deployDeclaration ?? project.adapter.deploy?.declaration;
          console.log(JSON.stringify(await checkHostedOutput(project.root, { declaration })));
          await checkHydration(project.root, {
            pages: project.adapter.publicPages, declaration,
            report: lines => lines.forEach(line => console.log(line)),
          });
          JS
      # The run site: homepage, /run and the docs from the repository's Markdown,
      # refused on any broken, instance-only or other-origin reference.
      - run: pnpm exec rer build --site --no-queue

  shards:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted runner toolchain space
        if: runner.environment == 'github-hosted' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # rer dev and preview require 15 GiB free. This disposable JavaScript job
          # does not use Android, .NET or Haskell; preserve Node, browsers and caches.
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
          for toolchain in /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup; do
            if df -Pk "$GITHUB_WORKSPACE" "$RUNNER_TEMP" | awk '
              NR > 1 && $4 < 20 * 1024 * 1024 { insufficient = 1 }
              END { exit insufficient }
            '; then
              break
            fi
            sudo rm -rf -- "$toolchain"
          done
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.20.0'
      - run: corepack enable && corepack prepare pnpm@10.12.4 --activate
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        if: matrix.kind == 'browser'
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - name: Execute this shard's existing assertions
        env:
          PIER_BROWSER_OUTPUT: ${{ runner.temp }}/pier-browser
          PIER_SCREENSHOTS: ${{ runner.temp }}/pier-browser/screenshots
          KIND: ${{ matrix.kind }}
          FILES: ${{ toJSON(matrix.files) }}
          GREP: ${{ matrix.grep }}
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const { KIND, FILES, GREP } = process.env;
          const args = KIND === 'api'
            ? ['--test', '--test-concurrency=1', ...JSON.parse(FILES)]
            : KIND === 'browser'
              ? ['tests/browser/run.mjs', '--grep', GREP]
              : KIND === 'portability' ? ['tests/portable.mjs'] : null;
          if (!args) throw new Error('Unknown verification shard');
          // Preserve the connector step's 1200-second command cap.
          const result = KIND === 'browser'
            ? spawnSync('timeout', ['1200', process.execPath, ...args], { stdio: 'inherit' })
            : spawnSync(process.execPath, args, { stdio: 'inherit' });
          if (result.error) throw result.error;
          if (result.signal) throw new Error(`Verification terminated by ${result.signal}`);
          process.exitCode = result.status;
          JS
      - uses: actions/upload-artifact@v4
        if: always() && matrix.kind == 'browser'
        with:
          name: connector-recovery-screens-${{ matrix.name }}
          path: ${{ runner.temp }}/pier-browser
          if-no-files-found: ignore
          retention-days: 7

  verify:
    needs: [plan, build-checks, shards]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
